<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenClaw - Agents</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .viz-wrapper {
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: var(--space-lg);
            height: calc(100vh - 150px);
        }

        #viz-container {
            background: var(--bg-card);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        #agent-network {
            width: 100%;
            height: 100%;
        }

        .agent-details-panel {
            background: var(--bg-card);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            padding: var(--space-md);
            overflow-y: auto;
        }

        .agent-card {
            background: var(--nord0);
            padding: var(--space-md);
            margin-bottom: var(--space-md);
            border-radius: 6px;
            border-left: 4px solid var(--nord3);
        }

        .status-running {
            border-left-color: var(--nord8);
        }

        .status-completed {
            border-left-color: var(--nord14);
        }

        .status-failed {
            border-left-color: var(--nord11);
        }

        .agent-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-sm);
        }

        .badge {
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .badge.running {
            background: rgba(136, 192, 208, 0.2);
            color: var(--nord8);
        }

        .badge.completed {
            background: rgba(163, 190, 140, 0.2);
            color: var(--nord14);
        }

        .badge.failed {
            background: rgba(191, 97, 106, 0.2);
            color: var(--nord11);
        }

        .agent-stats {
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: grid;
            gap: 4px;
        }

        .agent-stats div {
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>

<body>
    <div class="slide-menu" id="slide-menu">
        <div class="menu-header">
            <h3>Menu</h3>
            <button id="close-menu-btn" class="close-btn">&times;</button>
        </div>
        <ul class="menu-list">
            <li><a href="/">Dashboard</a></li>
            <li><a href="/agents" class="active">Agents</a></li>
            <li><a href="#">System Health</a></li>
            <li><a href="#">Logs</a></li>
            <li><a href="#">Settings</a></li>
        </ul>
        <div class="menu-footer">
            <p>OpenClaw v1.0</p>
        </div>
    </div>

    <div class="overlay" id="overlay"></div>

    <div class="container main-content">
        <header class="header">
            <div class="header-left">
                <button id="menu-toggle-btn" class="menu-btn">&#9776;</button>
                <h1>Agent Visualization</h1>
            </div>
            <div class="header-right">
                <div class="bot-status">
                    <span class="bot-name">🤖 OpenClaw</span>
                    <span id="status-indicator" class="status-offline">Connecting...</span>
                </div>
            </div>
        </header>

        <main class="agents-list-wrapper">
            <div class="toolbar">
                <button id="refresh-agents-btn" class="nord-btn">Refresh</button>
                <span id="data-source-indicator" class="source-badge">Local</span>
            </div>
            <div id="full-agent-list" class="agent-grid">
                <div class="empty-state">Loading agents...</div>
            </div>
        </main>
    </div>

    <!-- Container for dynamic modals -->
    <div id="modal-container"></div>

    <!-- Permissions Modal -->
    <div id="permissions-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content mini-modal">
            <div class="modal-header">
                <h2>Profile Permissions: <span id="modal-perm-agent"></span></h2>
                <button onclick="closeModal('permissions-modal')" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="perm-detail">
                    <label>Active Profile</label>
                    <div id="modal-perm-profile" class="profile-tag-lg"></div>
                    <p class="perm-desc" id="modal-perm-desc"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Cron Modal -->
    <div id="cron-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Scheduled Jobs: <span id="modal-cron-agent"></span></h2>
                <button onclick="closeModal('cron-modal')" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div id="modal-cron-list" class="cron-grid-detailed">
                    <!-- Cron jobs will be injected here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Skills Modal -->
    <div id="skills-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content mini-modal">
            <div class="modal-header">
                <h2>Enabled Skills: <span id="modal-skills-agent"></span></h2>
                <button onclick="closeModal('skills-modal')" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div id="modal-skills-list" class="skill-tags-lg">
                    <!-- Skills will be injected here -->
                </div>
            </div>
        </div>
    </div>

    <script src="agent_viz.js"></script>
</body>

</html>
